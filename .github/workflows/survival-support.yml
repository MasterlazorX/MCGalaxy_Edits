name: survival-support build

# The stock build.yml only runs on master / ConsoleDriver, so pushes to the
# survival-support branch never triggered CI. This fills that gap.
#
# It produces the lean classic .NET Framework output - the same layout as
# Visual Studio and the official MCGalaxy releases: MCGalaxy_.dll, MCGalaxy.exe,
# MCGalaxyCLI.exe plus the small bundled MySql.Data.dll / System.Data.SQLite.dll
# and no NuGet dependency tree. Built with msbuild + Mono, mirroring the stock
# build.yml's mono job (ubuntu-22.04 ships msbuild), just without the private
# upload/notify actions so it runs self-contained on a fork.

on:
  push:
    branches:
      - survival-support
      - 'survival-**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: survival-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build (.NET Framework via Mono/msbuild)
        run: |
          msbuild -version
          msbuild MCGalaxy.sln /p:Configuration=Release

      - name: Stage native SQLite alongside the build
        run: cp -f sqlite3_x32.dll sqlite3_x64.dll bin/Release/ 2>/dev/null || true

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MCGalaxy-survival-support-net4.0
          path: bin/Release
          if-no-files-found: error
